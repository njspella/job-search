name: Refresh jobs

# Pulls new postings into site-data/jobs.json, which the claude.ai tracker reads, and copies
# it to docs/jobs.json for the GitHub Pages site. Started by the daily scheduled task, the
# claude.ai page's Refresh button, or by hand (Actions > Refresh jobs > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh-jobs

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch postings
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python -m jobsearch export site-data/jobs.json
          cp site-data/jobs.json docs/jobs.json
      - name: Save results
        run: |
          git config user.name "job-search-bot"
          git config user.email "job-search-bot@users.noreply.github.com"
          git add site-data/jobs.json docs/jobs.json
          git commit -m "Refresh jobs" || echo "No changes"
          git push
